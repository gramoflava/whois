<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="I like reducing complexity in systems">
  <meta property="og:title" content="gramoflava (Vibrant SaaS Variant)">
  <title>whois.gramoflava.xyz - Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #FAFAFC;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #Ec4899;
      --accent-grad: linear-gradient(135deg, #F43F5E 0%, #8B5CF6 100%);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-hover: 0 25px 35px -5px rgba(0, 0, 0, 0.08), 0 12px 15px -8px rgba(0, 0, 0, 0.02);
      
      --radius-sm: 12px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--bg);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Vibrant Mesh Background */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 80vw;
      height: 80vw;
      max-width: 800px;
      max-height: 800px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.5;
      animation: drift 20s infinite alternate ease-in-out;
    }
    
    body::before {
      top: -10vw; left: -10vw;
      background: radial-gradient(circle, #8b5cf666 0%, transparent 70%);
      animation-delay: -5s;
    }

    body::after {
      bottom: -10vw; right: -10vw;
      background: radial-gradient(circle, #f43f5e66 0%, transparent 70%);
      animation-delay: -10s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(100px, 50px) scale(1.2); }
      100% { transform: translate(-50px, 100px) scale(0.9); }
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.8; }

    /* ── Layout ──────────────────────────────────────────────── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    /* ── Hero ────────────────────────────────────────────────── */
    .hero {
      text-align: center;
      margin-bottom: 6rem;
      position: relative;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1.25rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.8);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .hero-name {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      font-size: clamp(1.25rem, 2vw, 1.5rem);
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .skills-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.9);
      padding: 0.6rem 1.25rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .pill:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* ── Projects ────────────────────────────────────────────── */
    .section-title {
      font-size: 2rem;
      font-weight: 800;
      text-align: left;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .project-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    .project-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .project-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-grad);
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .project-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .project-desc {
      color: var(--text-muted);
      flex: 1;
      margin-top: 1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .project-foot {
      display: flex;
      justify-content: flex-start;
      gap: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
      color: var(--text);
      transition: background 0.2s, transform 0.2s;
    }

    .btn:hover {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--text);
      color: white;
    }
    
    .btn-primary:hover {
      background: #334155;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 6rem;
      padding-top: 3rem;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    .footer-links a {
      color: var(--text-muted);
      font-weight: 600;
    }
    .footer-links a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="hero">
      <div class="hero-badge">whois</div>
      <h1 class="hero-name">gramoflava</h1>
      <p class="hero-tagline">Finding elegant ways to reduce complexity in software and organizations.</p>
      
      <div class="skills-pills">
        <span class="pill">Embedded Linux</span>
        <span class="pill">Delivery Pipelines</span>
        <span class="pill">Process Architecture</span>
        <span class="pill">LLM Infrastructure</span>
        <span class="pill">AI Governance</span>
      </div>
    </header>

    <main>
      <h2 class="section-title">Latest Deployments</h2>
      <div id="projects-grid" class="projects-grid">
        <!-- Loader -->
        <h3 style="color: var(--text-muted); text-align:center; grid-column: 1/-1;">Loading awesome projects...</h3>
      </div>
    </main>

    <footer>
      <div class="footer-links">
        <a href="https://github.com/gramoflava" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/gramoflava" target="_blank">LinkedIn</a>
      </div>
      <p style="color: var(--text-muted); margin-top: 1rem; font-size: 0.9rem;">Clean, simple, fast.</p>
    </footer>
  </div>

  <script>
    function renderCard(repo) {
      const card = document.createElement('article');
      card.className = 'project-card';
      
      // Initials for icon
      const initial = repo.name.charAt(0).toUpperCase();

      const liveUrl = (repo.homepage && repo.homepage.trim()) ? repo.homepage.trim() : (repo.has_pages ? 'https://gramoflava.github.io/' + repo.name : null);
      
      card.innerHTML = `
        <div class="project-head">
          <div class="project-icon">${initial}</div>
          ${repo.stargazers_count > 0 ? `<div style="font-weight:800; color:var(--accent);">★ ${repo.stargazers_count}</div>` : ''}
        </div>
        <h3 class="project-name">${repo.name}</h3>
        <p class="project-desc">${repo.description || 'A smart software solution.'}</p>
        <div class="project-foot">
          <a href="${repo.html_url}" target="_blank" class="btn">GitHub</a>
          ${liveUrl ? `<a href="${liveUrl}" target="_blank" class="btn btn-primary">Live Demo</a>` : ''}
        </div>
      `;
      return card;
    }

    async function fetchProjects() {
      try {
        const res = await fetch('https://api.github.com/users/gramoflava/repos?sort=updated&type=public&per_page=20');
        if (!res.ok) throw new Error('API Error');
        let repos = await res.json();
        repos = repos.filter(r => !r.fork).sort((a,b) => (b.has_pages?1:0) - (a.has_pages?1:0) || new Date(b.updated_at) - new Date(a.updated_at));
        
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = '';
        repos.forEach(repo => grid.appendChild(renderCard(repo)));
      } catch (e) {
        document.getElementById('projects-grid').innerHTML = '<div style="color:var(--accent)">Failed to fetch deployments.</div>';
      }
    }
    
    fetchProjects();
  </script>
</body>
</html>
